<!DOCTYPE html>
<html>
<head>
  <title>Translaty</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body style="margin: 0; padding: 0; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px;">
  <div id="translaty-panel">
    <div class="tabs">
      <button class="tab active" data-tab="current">Translation</button>
      <button class="tab" data-tab="history">History</button>
      <button class="tab" data-tab="settings">Settings</button>
    </div>
    <div class="content">
      <div class="tab-content current active" style="display: block;">
        <h3>Latest Translation</h3>
        <p class="translation">Translation: No recent translation.</p>
      </div>
      <div class="tab-content history" style="display: none;">
        <h3>History</h3>
        <ul class="history-list"></ul>
      </div>
      <div class="tab-content settings" style="display: none;">
        <h3>Settings</h3>
        <label for="mode-select">Translation Mode:</label>
        <select id="mode-select"></select>
        <div id="custom-fields" style="display: none; margin-top: 10px;">
          <label for="custom-prompt">Custom Prompt Template (use {language}):</label>
          <textarea id="custom-prompt" rows="4" style="width: 100%;"></textarea>
          <label for="custom-temperature">Temperature (0-2):</label>
          <input type="number" id="custom-temperature" min="0" max="2" step="0.1">
          <label for="custom-topk">TopK (1-128):</label>
          <input type="number" id="custom-topk" min="1" max="128">
        </div>
        <label for="language-select">Target Language:</label>
        <select id="language-select"></select>
        <button id="clear-history" style="margin-top: 10px;">Clear History</button>
        <button id="copy-history" style="margin-top: 10px;">Copy History to Clipboard</button>
      </div>
    </div>
  </div>
  <script src="modes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
